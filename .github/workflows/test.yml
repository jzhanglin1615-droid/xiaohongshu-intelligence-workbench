name: Tests

on:
  push:
  pull_request:

jobs:
  local-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Initialize empty local data
        run: npm run setup
      - name: Core and UI tests
        run: npm test
      - name: UI regression tests
        run: npm run test:ui-regressions
      - name: Collection recovery tests
        run: npm run test:collection-recovery
